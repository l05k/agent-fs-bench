# Example plan for multi_host_nas_fs.py. Replace the hosts and NAS source.
version: 1

experiment:
  name: shared-nas-contention

ssh:
  user: bench
  identity_file: ~/.ssh/id_ed25519
  options:
    - StrictHostKeyChecking=accept-new
    - ServerAliveInterval=30
    - ServerAliveCountMax=3

hosts:
  - name: node-a
    address: 10.10.0.11
  - name: node-b
    address: 10.10.0.12
  - name: node-c
    address: 10.10.0.13
    user: root
    port: 2222

nas:
  source: nas01.example.com:/export/agent-fs
  fstype: nfs
  options: vers=4.2,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2
  mountpoint: /mnt/agent-fs-nas
  run_root: /mnt/agent-fs-nas/agent-fs-bench/shared-nas
  privileged: true
  verify_source: true
  mount_timeout_s: 120
  unmount_timeout_s: 60
  unmount_on_exit: true

workload:
  files_per_host: 512
  file_size_bytes: 8192
  directories: 16
  shared_files_per_host: 256
  rounds: 3
  fsync: true
  read_back: true
  cleanup_private: false

remote:
  python: python3
  worker_dir: /var/tmp/agent-fs-bench
  ready_timeout_s: 180
  run_timeout_s: 1800
