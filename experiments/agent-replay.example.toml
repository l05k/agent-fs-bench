# Copy to local/agent-replay.toml on every node. Pin task revisions and image
# digests before capture. List every selected task/harness, even when its
# cassette is missing, so capture failures stay in the planned denominator.
# Paths are relative to this file. Keep them outside measured targets.

[[cases]]
name = "task-a-codex"
benchmark = "swe-bench-pro-v2"
task_id = "task-a"
agent = "codex"
task = "replay/task-a"
cassette = "replay/cassettes/task-a-codex"

# Each task restores a fresh copy of every source directory before EVERY measured
# replay. Include hidden files (.git), modes and links; bind mounts hide image
# contents. Keep container paths the same as capture and do not overlap them.
[[cases.mounts]]
source = "replay/initial/task-a"
container = "/app"

# Additional task-data directories, if the task uses them:
# [[cases.mounts]]
# source = "replay/initial/task-a-data"
# container = "/data"
