# Copy to local/hosts.toml. Host keys and noninteractive SSH auth must be configured.
# multi-host: every entry is a worker; mount the same target path externally.
# mount-scale: list REMOTE machines only, in fill order; the current Linux
# controller is always used first. All hosts use the same staging/admin paths,
# target profile, Open MPI 4.1.x and mdtest binary. Allow group-internal MPI TCP.
# To fill only local CPUs with mount-scale clients=None, use: hosts = []
# Never list the controller again; each address must identify one distinct machine.
[[hosts]]
name = "node-a"
address = "node-a.example.net"
user = "bench"
port = 22
python = "python3"
ssh_args = ["-o", "ServerAliveInterval=30"]

[[hosts]]
name = "node-b"
address = "node-b.example.net"
user = "bench"
# Optional: ssh_args = ["-i", "/home/operator/.ssh/bench_ed25519"]
